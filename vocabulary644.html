; // REPLACEME
    const palette = ["#eef7ff", "#fff4ed", "#f1f8ee", "#f8f0ff", "#fffbea", "#edf7f5", "#f5f1ff", "#fff0f3"];
    const reader = document.getElementById("reader");
    const counter = document.getElementById("counter");
    const jump = document.getElementById("jump");
    const shuffleToggle = document.getElementById("shuffle");
    let cards = [...originalCards];
    let index = 0;
    let touchStartY = null;

    function shuffle(list) {
      for (let i = list.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [list[i], list[j]] = [list[j], list[i]];
      }
      return list;
    }

    function safe(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;", "'":"&#39;"}[ch]));
    }

    function speakWord(word, delay = 0) {
      if (!("speechSynthesis" in window)) return;
      const speak = () => {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(String(word));
        utterance.lang = "en-US";
        utterance.rate = 0.9;
        window.speechSynthesis.speak(utterance);
      };
      if (delay) window.setTimeout(speak, delay);
      else speak();
    }

    function showCard(shouldSpeak = false) {
      const item = cards[index];
	  const ex = "Example";
      reader.innerHTML = `<article class="card">
        <h2><strong>${safe(item.word)}</strong><button type="button" class="speak-button" data-word="${safe(item.word)}. ${safe(item.word)}. ${safe(item.meaning)}. . ${safe(item.contextMeaning)}. . ${safe(item.example)}. ." aria-label="Play pronunciation for ${safe(item.word)}">🔊🔊🔊🔊🔊</button></h2>
        <p class="meaning">${safe(item.meaning)}</p>
        <p class="context-label2">${safe(item.context)}</p>
        <p class="context">${safe(item.contextMeaning)}</p>
        <p class="example"><strong>Example:</strong> ${safe(item.example)}</p>
      </article>`;
      counter.textContent = `${index + 1}/${cards.length}`;
      jump.value = index + 1;
      document.body.style.backgroundColor = palette[index % palette.length];
      const speakButton = document.querySelector(".speak-button");
      speakButton.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        speakWord(speakButton.dataset.word);
      });
      speakWord(`${item.word} . ${item.word} . ${item.meaning} . . ${item.contextMeaning} . ${ex}. . ${item.example} . .`);
    }

    function goTo(nextIndex, shouldSpeak = false) {
      index = (nextIndex + cards.length) % cards.length;
      showCard(shouldSpeak);
    }

    // Deliberately follows the requested direction: upward scroll = next card.
    function handleWheel(event) {
      event.preventDefault();
      if (Math.abs(event.deltaY) < 8) return;
      goTo(index + (event.deltaY < 0 ? 1 : -1), true);
    }

    reader.addEventListener("wheel", handleWheel, { passive: false });
    reader.addEventListener("touchstart", event => { touchStartY = event.touches[0].clientY; }, { passive: true });
    reader.addEventListener("touchend", event => {
      if (touchStartY === null) return;
      const distance = event.changedTouches[0].clientY - touchStartY;
      if (Math.abs(distance) > 35) goTo(index + (distance < 0 ? 1 : -1), true);
      touchStartY = null;
    }, { passive: true });
    window.addEventListener("keydown", event => {
      if (event.target === jump) return;
      if (event.key === "ArrowUp" || event.key === "PageUp") goTo(index + 1);
      if (event.key === "ArrowDown" || event.key === "PageDown") goTo(index - 1);
    });
    jump.addEventListener("change", () => {
      const requested = Number.parseInt(jump.value, 10);
      if (Number.isFinite(requested) && requested >= 1 && requested <= cards.length) goTo(requested - 1);
      else jump.value = index + 1;
    });
    shuffleToggle.addEventListener("change", () => {
      localStorage.setItem("vocabularyShuffle", shuffleToggle.checked ? "1" : "0");
      cards = shuffleToggle.checked ? shuffle([...originalCards]) : [...originalCards];
      index = 0;
      showCard();
    });

    const shouldShuffle = localStorage.getItem("vocabularyShuffle") === "1";
    shuffleToggle.checked = shouldShuffle;
    if (shouldShuffle) cards = shuffle(cards);
    showCard();
  </script>
